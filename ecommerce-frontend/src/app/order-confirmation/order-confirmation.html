<div class="success-container">
  <mat-card class="success-card">
    <mat-card-content>

      <!-- Success Icon -->
      <div class="success-icon-wrapper">
        <mat-icon class="success-icon">check_circle</mat-icon>
      </div>

      <!-- Success Message -->
      <h1 class="success-title">Order Placed Successfully!</h1>
      <p class="success-message">
        Your order has been confirmed and will be delivered to you within
        <strong>4-5 business days</strong>.
      </p>

      <!-- Action Buttons -->
      <div class="success-actions">
        <button mat-flat-button routerLink="/home">
          Continue Shopping
        </button>
        <!--<button mat-stroked-button routerLink="/order-history">
          View Orders
        </button>-->
      </div>

    </mat-card-content>
  </mat-card>
</div>
